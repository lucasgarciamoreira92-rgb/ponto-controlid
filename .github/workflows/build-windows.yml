name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/import-colaboradores
  pull_request:
    branches:
      - main

concurrency:
  group: atlas-ponto-windows-feature
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Smoke test application backup restore and PDF preview
        shell: pwsh
        run: |
          python -m py_compile app_paths.py db.py backup_restore.py backup_routes.py month_runtime_guard.py closure_admin.py monthly_preview.py app_main.py
          python -c "import app_main; from backup_restore import create_backup_archive, inspect_backup_archive, restore_backup_archive; p=create_backup_archive('CI_Backup'); info=inspect_backup_archive(p); assert info['counts']['employees'] >= 0; result=restore_backup_archive(p); assert result['restored'] is True; print('Backup/restore smoke test OK:', p)"
          python -c "from monthly_preview import build_monthly_preview_pdf; report={'employee':{'name':'Colaborador Teste'},'days':[],'totals':{'worked':0,'overtime_weekday':0,'overtime_saturday':0,'overtime_sunday_holiday':0,'shortage':0,'bank':0},'absence_count':0,'forgotten_count':0}; settings={'company_name':'Atlas Teste','bank_hours_enabled':'0','overtime_weekday_percent':'50'}; pdf=build_monthly_preview_pdf('2026-08',settings,[report]); assert pdf[:4]==b'%PDF'; assert len(pdf)>1000; print('PDF preview smoke test OK:', len(pdf))"

      - name: Build Atlas Ponto application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean AtlasPonto.spec
          if (!(Test-Path "dist\AtlasPonto\AtlasPonto.exe")) { throw "AtlasPonto.exe não foi gerado" }

      - name: Run packaged Windows application
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\AtlasPonto\AtlasPonto.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($proc.HasExited) { break }
            }
            if (-not $ok) {
              $log = Join-Path $env:LOCALAPPDATA "Atlas Ponto\data\atlas_ponto.log"
              if (Test-Path $log) {
                Write-Host "----- atlas_ponto.log -----"
                Get-Content $log
                Write-Host "---------------------------"
              }
              throw "O executável empacotado não respondeu em /health"
            }
            Write-Host "Packaged executable smoke test OK"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          & $iscc "installer\AtlasPonto.iss"
          if (!(Test-Path "installer\output\AtlasPonto-Setup.exe")) { throw "Instalador não foi gerado" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AtlasPonto-Windows
          path: installer/output/AtlasPonto-Setup.exe
          if-no-files-found: error
          retention-days: 30
