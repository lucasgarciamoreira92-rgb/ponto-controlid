name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/import-colaboradores
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.21.0

      - name: Build Atlas Ponto application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean AtlasPonto.spec
          if (!(Test-Path "dist\AtlasPonto\AtlasPonto.exe")) { throw "AtlasPonto.exe não foi gerado" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          & $iscc "installer\AtlasPonto.iss"
          if (!(Test-Path "installer\output\AtlasPonto-Setup.exe")) { throw "Instalador não foi gerado" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AtlasPonto-Windows
          path: installer/output/AtlasPonto-Setup.exe
          if-no-files-found: error
          retention-days: 30
