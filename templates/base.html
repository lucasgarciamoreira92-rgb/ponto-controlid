<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0c">
  <title>{% block title %}Atlas · Ponto & Jornada{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=atlas-ponto-20260818-0021">
  <link rel="stylesheet" href="/static/atlas_dashboard.css?v=atlas-ponto-20260818-0021">
  <link rel="stylesheet" href="/static/responsive_fix.css?v=atlas-ponto-20260818-0021">
  <link rel="stylesheet" href="/static/print_report.css?v=atlas-ponto-20260818-0021">
</head>
<body>
{% set current_path = request.url.path %}
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span>A</span></div>
      <div class="brand-copy">
        <strong>Atlas</strong>
        <small>PONTO &amp; JORNADA</small>
      </div>
    </div>

    <div class="module-pill"><span></span>Módulo de gestão de jornada</div>

    <nav aria-label="Navegação principal">
      <a href="/" class="{% if current_path == '/' %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
        </span>
        <span>Dashboard</span>
      </a>
      <a href="/import" class="{% if current_path.startswith('/import') %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
        </span>
        <span>Importar AFD</span>
      </a>
      <a href="/employees" class="{% if current_path.startswith('/employees') or current_path.startswith('/month-schedules') or current_path.startswith('/report') %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m7-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 10v-2a4 4 0 0 0-3-3.87M16 2.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span>Colaboradores</span>
      </a>
      <a href="/closures" class="{% if current_path.startswith('/closures') %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 5h6l2 2h10v12H3V5Zm4 5h10m-10 4h10"/></svg>
        </span>
        <span>Competências fechadas</span>
      </a>
      <a href="/settings" class="{% if current_path.startswith('/settings') %}active{% endif %}">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.83 2.83-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.08V21h-4v-.08A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06-2.83-2.83.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.08-.4H3v-4h.08A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06 2.83-2.83.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .4-1.08V3h4v.08A1.65 1.65 0 0 0 15.4 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06 2.83 2.83-.06.06A1.65 1.65 0 0 0 19.4 9c.16.37.37.71.6 1 .27.34.65.57 1.08.6H21v4h-.08a1.65 1.65 0 0 0-1.52.4Z"/></svg>
        </span>
        <span>Configurações</span>
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-status">
      <div class="status-dot"></div>
      <div>
        <strong>Dados locais</strong>
        <small>SQLite + AFD original</small>
      </div>
    </div>

    <div class="sidebar-foot">
      <div class="avatar">P</div>
      <div><strong>Ponto</strong><span>ATLAS ECOSYSTEM</span></div>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>

<script>
(function () {
  document.querySelectorAll('.month-form').forEach(function (form) {
    const input = form.querySelector('input[type="month"][name="month"]');
    if (!input) return;

    form.querySelectorAll('button[type="submit"], button:not([type])').forEach(function (button) {
      button.remove();
    });

    if (!input.hasAttribute('onchange')) {
      input.addEventListener('change', function () {
        form.requestSubmit();
      });
    }
  });

  /* O PDF individual usa o mesmo gerador oficial do PDF consolidado. */
  if (window.location.pathname.startsWith('/report/')) {
    document.querySelectorAll('button[onclick*="window.print"]').forEach(function (button) {
      button.removeAttribute('onclick');
      button.addEventListener('click', function () {
        const monthInput = document.querySelector('.month-form input[type="month"][name="month"]');
        const month = monthInput ? monthInput.value : '';
        const url = window.location.pathname.replace(/\/$/, '') + '/pdf?month=' + encodeURIComponent(month);
        window.open(url, '_blank', 'noopener');
      });
    });
  }
})();
</script>
</body>
</html>
